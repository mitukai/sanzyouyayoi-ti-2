<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>三条ヤヨイ</title>
    <!-- 和風感を出すための明朝体フォントを読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* メインカラーの指定 */
            --primary-orange: #E95420; /* 朱色に近いオレンジ */
            --bg-white: #fdfaf7; /* 温かみのある白 */
            --text-main: #333333;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            background-color: var(--bg-white);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        /* ヘッダー周り */
        header {
            text-align: center;
            padding: 80px 20px 40px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 0.3em;
            color: var(--primary-orange);
            margin: 0;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            color: #888;
            margin-top: 10px;
        }

        /* タブバー */
        .tab-bar {
            display: flex;
            justify-content: center;
            border-top: 1px solid var(--primary-orange);
            border-bottom: 1px solid var(--primary-orange);
            max-width: 800px;
            margin: 0 auto;
            padding: 0;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 0.1em;
            color: var(--text-main);
            transition: all 0.3s ease;
            position: relative;
        }

        .tab:hover {
            color: var(--primary-orange);
            background-color: rgba(233, 84, 32, 0.05);
        }

        .tab.active {
            color: var(--primary-orange);
            font-weight: bold;
        }

        /* タブの間の区切り線 */
        .tab:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 30%;
            height: 40%;
            width: 1px;
            background-color: var(--primary-orange);
            opacity: 0.3;
        }

        /* メインコンテンツ */
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .content-section {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .content-section.active {
            display: block;
        }

        /* 画像配置用の枠（他のセクション用） */
        .image-placeholder {
            width: 100%;
            height: 400px;
            background-color: #ffffff;
            border: 1px dashed var(--primary-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-orange);
            margin: 30px 0;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
        }

        /* アニメーション */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           立ち絵紹介セクション（和風にアレンジ）
           ========================================= */
        .vtuber-showcase {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 40px 0; /* 左右のpaddingをなくしてスッキリと */
            margin: 0 auto 30px;
        }

        /* 縦長の画像枠（少し角を立たせて和紙っぽい色に） */
        .image-frame {
            width: 280px;
            height: 450px;
            border-radius: 4px; /* 和風は少し角張っている方が綺麗 */
            overflow: hidden;
            background-color: #f4ede5; /* 背景に馴染む薄い生成り色 */
            border: 1px solid rgba(233, 84, 32, 0.2); /* 朱色の繊細な枠線 */
            box-shadow: 0 8px 24px rgba(233, 84, 32, 0.05); /* 影も少し暖色に */
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.4s ease-in-out; /* しっとり切り替わるように時間調整 */
        }

        /* ボタンを縦に並べるエリア */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 24px; /* 和風なので少し間隔を広めに */
        }

        /* ひし形ボタン（和の菱紋をイメージ） */
        .diamond-btn {
            width: 12px;
            height: 12px;
            background-color: #e0d5c1; /* 非アクティブ時はくすんだ色 */
            border: none;
            cursor: pointer;
            transform: rotate(45deg);
            transition: all 0.3s ease;
            outline: none;
            padding: 0;
        }

        .diamond-btn:hover {
            background-color: #d1bfae;
        }

        /* 選択中のボタン（朱色に光る） */
        .diamond-btn.active {
            background-color: var(--primary-orange);
            transform: rotate(45deg) scale(1.4);
            box-shadow: 0 0 10px rgba(233, 84, 32, 0.3);
        }
        
        .profile-text {
            font-size: 1rem;
            letter-spacing: 0.1em;
            line-height: 2;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <!-- VTuberの名前 -->
        <h1>三条ヤヨイ</h1> 
        <p class="subtitle">Virtual Youtuber Official</p>
    </header>

    <!-- 5つの横タブバー -->
    <div class="tab-bar">
        <!-- JSのエラーを防ぐため、引数に event を追加しています -->
        <div class="tab active" onclick="switchTab(event, 'profile')">紹介</div>
        <div class="tab" onclick="switchTab(event, 'news')">イベント</div>
        <div class="tab" onclick="switchTab(event, 'stream')">活動</div>
        <div class="tab" onclick="switchTab(event, 'goods')">○○</div>
        <div class="tab" onclick="switchTab(event, 'contact')">お問い合わせ</div>
    </div>

    <main>

        <section id="profile" class="content-section active">
            
            <!-- ここから立ち絵紹介セクション -->
            <div class="vtuber-showcase">
                <!-- 画像表示エリア -->
                <div class="image-frame">
                    <!-- 和風テスト用にプレースホルダーの色も合わせています -->
                    <img id="tachie-img" src="nomal-yay-1.png" alt="通常立ち絵">
                </div>

                <!-- ひし形ボタンエリア -->
                <div class="controls">
                    <button class="diamond-btn active" onclick="changeImage('normal', this)" aria-label="通常立ち絵"></button>
                    <button class="diamond-btn" onclick="changeImage('alt', this)" aria-label="別衣装立ち絵"></button>
                </div>
            </div>
            
            <p class="profile-text">紹介</p>
            
        </section>


        <section id="news" class="content-section">
            <p>最新のお知らせはまだありません。</p>
        </section>

        <!-- 活動 (Stream/Videos) -->
        <section id="stream" class="content-section">
            <div class="image-placeholder" style="height: 250px;">[ 活動用の画像を配置 ]</div>
            <p>主な活動記録</p>
        </section>

        <!-- 万屋 (Goods) -->
        <section id="goods" class="content-section">
            <div class="image-placeholder" style="height: 250px;">[ グッズ画像を配置 ]</div>
            <p>○○</p>
        </section>

        <!-- Contact -->
        <section id="contact" class="content-section">
            <p>お問い合わせやお手紙はこちらへ。</p>
        </section>
    </main>

    <!-- プログラム部分 -->
    <script>
        // タブ切り替え機能（eventを受け取るように修正し、バグをなくしました）
        function switchTab(event, tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(c => c.classList.remove('active'));

            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // 立ち絵切り替え機能
        const images = {
            normal: 'nomal-yay-1.png',  // 上のボタン用
            alt: 'meido-yayy.jpg'   // 下のボタン用
        };

        function changeImage(type, btnElement) {
            const buttons = document.querySelectorAll('.diamond-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            btnElement.classList.add('active');

            const img = document.getElementById('tachie-img');
            img.style.opacity = 0; 
            
            setTimeout(() => {
                img.src = images[type];
                img.style.opacity = 1; 
            }, 200); // しっとり感を出すため少し時間を伸ばしました
        }
    </script>
</body>
</html>
